{% if results.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if results.has_previous %}<a class="button button-outline" href="{% querystring page=results.previous_page_number %}">← Previous</a>{% endif %}<span>Page {{ results.number }} of {{ results.paginator.num_pages }}</span>{% if results.has_next %}<a class="button button-outline" href="{% querystring page=results.next_page_number %}">Next →</a>{% endif %}</nav>{% endif %}
