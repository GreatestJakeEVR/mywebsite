name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: website
          POSTGRES_USER: website
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U website -d website"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://website:ci-only-password@localhost:5432/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests --noinput
      - run: python manage.py collectstatic --noinput --settings=config.settings.build
      - run: docker build -t jake-ardoin:ci .
      - run: bash -n deploy/release.sh deploy/compose.sh deploy/backup.sh
      - run: pip install cfn-lint==1.56.3
      - run: cfn-lint deploy/media.cloudformation.yaml deploy/server.cloudformation.yaml
      - name: Start production container against PostgreSQL
        env:
          RELEASE_TAG: ci
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          text = Path('.env.production.example').read_text()
          text = text.replace('REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_50_CHARACTERS_LONG', secrets.token_hex(40))
          text = text.replace('REPLACE_WITH_RANDOM_HEX', secrets.token_hex(24))
          text = text.replace('REPLACE_WITH_MEDIA_BUCKET', 'ci-placeholder-media')
          text = text.replace('REPLACE_WITH_BACKUP_BUCKET', 'ci-placeholder-backup')
          text = text.replace('REPLACE_WITH_DISTRIBUTION_DOMAIN', 'example.cloudfront.net')
          Path('.env.production').write_text(text)
          PY
          bash deploy/compose.sh up -d --wait db
          bash deploy/compose.sh run --rm web python manage.py check --deploy --fail-level WARNING
          bash deploy/compose.sh run --rm web python manage.py migrate --noinput
          bash deploy/compose.sh run --rm web python manage.py createcachetable
          bash deploy/compose.sh up -d --wait --wait-timeout 180 web
      - name: Stop test containers
        if: always()
        env:
          RELEASE_TAG: ci
        run: |
          if [ -f .env.production ]; then
            bash deploy/compose.sh logs --tail=50 web
            bash deploy/compose.sh down -v
          fi
